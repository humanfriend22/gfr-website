name: Deploy Preview (Bun)

on:
  push:
    branches:
      - main
      - preview-*
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: ./app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Code
          uses: actions/checkout@v7

        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: 1.4.3

        - name: Cache Bun
          id: cache-bun
          uses: actions/cache@v6
          with:
            path: ~/.bun/install/cache
            key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
            restore-keys: |
              ${{ runner.os }}-bun-

        - name: Install dependencies
          id: install
          run: |
            START_TIME=$SECONDS
            bun install --frozen-lockfile
            echo "secs=$((SECONDS - START_TIME))" >> $GITHUB_OUTPUT

        - name: List deps state
          id: list-deps
          continue-on-error: true
          run: bun pm ls

        - name: Build the app
          id: build
          run: |
            START_TIME=$SECONDS
            bun run build
            echo "secs=$((SECONDS - START_TIME))" >> $GITHUB_OUTPUT

        - uses: FirebaseExtended/action-hosting-deploy@v0
          id: deploy
          with:
            repoToken: ${{ secrets.GITHUB_TOKEN }}
            firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GAEL_FORCE_ROBOTICS_HF }}
            projectId: gael-force-robotics-hf
            channelId: ${{ github.ref_name == 'main' && 'preview' || format('preview-{0}', github.ref_name) }}

        - name: Write Summary
          run: |
              {
                echo "**view:** ${{ steps.deploy.outputs.details_url }}"
                echo "**metrics:**"
                echo "- deps install (${{ steps.cache-bun.outputs.cache-hit == 'true' && 'cached' || 'uncached' }}): ${{ steps.install.outputs.secs }}s"
                echo "- app build: ${{ steps.build.outputs.secs }}s"
              } >> $GITHUB_STEP_SUMMARY
